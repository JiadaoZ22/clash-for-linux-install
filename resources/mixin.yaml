mixed-port: 7890

# ════════════════════════════════════════════════════════════════
#  Streaming egress policy (dual-NIC) — FILL IN ONCE PER HOST
# ════════════════════════════════════════════════════════════════
#  Goal:
#    1) On-net/intranet streaming (e.g. any host containing the
#       STREAM_KEYWORD, such as "midea") -> WIRED NIC, always DIRECT
#       (never via a VPN provider node, regardless of clashctl state).
#    2) All other streaming ........................... -> WIFI NIC.
#       Whether it additionally exits through a VPN provider node depends
#       ONLY on clashctl (on/off), the active mode (Rule/Global/Direct)
#       and the proxy-group selection — nothing here is tied to a provider,
#       so the same file works with ANY subscription on ANY machine.
#
#  Placeholders — list interface names with: ip -o link show
#    WIRED_NIC      wired NIC,  e.g. eth0 / enp1s0 / enp130s0
#    WIFI_NIC       WiFi NIC,   e.g. wlan0 / wlp3s0 / wlp131s0
#    STREAM_KEYWORD on-net streaming keyword, e.g. midea / company
#
#  Activation:
#    1. Uncomment every template line marked below (remove leading "# ").
#    2. Replace the placeholders with this host's values.
#    3. Save via `clashctl mixin -e` (merge + restart are automatic).
#
#  Global default egress = WIFI: proxy nodes (the VPN transport), ordinary
#  DIRECT and DNS all dial from WIFI_NIC. An outbound with its own
#  interface-name (WIRED-DIRECT below) overrides the global value.
# interface-name: wlan0                       # <- WIFI_NIC

external-controller: "0.0.0.0:9090"
external-ui: dist
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
secret:

allow-lan: false # 若开启务必设置身份验证以防暴露公网后被滥用
authentication:
  # - "username:password"

# ─── Mixin 作用说明 ──────────────────────────────────────────────
#   prepend   前置插入：插入到原列表开头，适用于 rules / proxies / proxy-groups
#   append    后置追加：追加到原列表末尾，适用于 rules / proxies / proxy-groups
#   override  整体替换：按 name 匹配并替换整个项目，适用于 proxies / proxy-groups
#   inject    节点注入：向指定 proxy-group 的 proxies 列表注入节点，仅适用于 proxy-groups
#
#   Mixin 对所有订阅全局生效——切换或更新订阅时都会重新合并。
#   编辑后保存即自动合并并重启内核。
#   更多示例：https://github.com/nelvko/clash-for-linux-install/discussions/562
# ────────────────────────────────────────────────────────────────

rules:
  prepend:
    # ─── Chinese cloud drives: always DIRECT when the endpoint is in China ───
    # These services host their API + upload/CDN nodes on China IPs, so routing
    # them out through a proxy node only adds latency/bandwidth cost (the proxy's
    # downlink is often rate-limited, e.g. [0.3X]). The GEOIP,cn fallback already
    # sends most of these direct; the explicit rules make it deterministic across
    # subscriptions regardless of rule ordering. See README "Chinese Cloud Drives".
    - DOMAIN-SUFFIX,alipan.com,DIRECT            # AliYunPan (阿里云盘)
    - DOMAIN-SUFFIX,aliyundrive.com,DIRECT       # AliYunPan legacy/CDN
    - DOMAIN-SUFFIX,baidupcs.com,DIRECT          # BaiduNetdisk (百度网盘)
    - DOMAIN-SUFFIX,pan.baidu.com,DIRECT
    - DOMAIN-SUFFIX,bdimg.com,DIRECT             # Baidu CDN used by netdisk
    - DOMAIN-SUFFIX,quark.cn,DIRECT              # Quark (夸克网盘)
    - DOMAIN-SUFFIX,189.cn,DIRECT                # TianYi Cloud (天翼云盘)
    - DOMAIN-SUFFIX,189cloud.com,DIRECT
    - DOMAIN-SUFFIX,115.com,DIRECT               # 115 网盘
    - DOMAIN-SUFFIX,ctfile.com,DIRECT            # ChengTong/城通网盘
    - DOMAIN-SUFFIX,ctfile.net,DIRECT
    - DOMAIN-SUFFIX,pan.xunlei.com,DIRECT        # XunLei (迅雷云盘)
    - DOMAIN-SUFFIX,xunlei.com,DIRECT
    - DOMAIN-SUFFIX,weiyun.com,DIRECT            # Weiyun (腾讯微云)
    # Endpoint already abroad (e.g. a CDN PoP outside CN) keeps normal rule
    # processing — the GEOIP,cn test applies to the resolved destination.
    - DOMAIN,api64.ipify.org,DIRECT # 用于 clashui 获取真实公网 IP
    # ─── On-net streaming: forced DIRECT via the WIRED NIC ───────────────
    #   List every keyword / domain suffix / server IP that belongs to the
    #   on-net streaming service. prepend rules are matched top-down and win
    #   over the subscription's own rules, so these stay direct even when the
    #   VPN provider is ON and a proxy node is selected elsewhere.
    # - DOMAIN-KEYWORD,midea,WIRED-DIRECT                 # <- STREAM_KEYWORD
    # - DOMAIN-SUFFIX,midea.com,WIRED-DIRECT
    # - DOMAIN-SUFFIX,midea.com.cn,WIRED-DIRECT
    # - IP-CIDR,10.0.0.5/32,WIRED-DIRECT,no-resolve       # pin streaming server IPs
    # ─── Plain intranet direct (no NIC binding needed) ──────────────────
    # - DOMAIN-KEYWORD,company,DIRECT
  append:

proxies:
  prepend:
    # ─── Direct outbound pinned to the WIRED NIC (dual-NIC hosts) ────────
    #   interface-name forces egress via SO_BINDTODEVICE, independent of the
    #   system default route, so on-net streaming can never leak onto WiFi.
    #   On single-NIC hosts use the built-in DIRECT instead and delete this.
    # - {name: WIRED-DIRECT, type: direct, udp: true, interface-name: eth0} # <- WIRED_NIC
  append:
  override:

proxy-groups:
  prepend:
  append:
  override:
  inject:

# ─── DNS for on-net domains (optional but usually required) ─────
#   If on-net streaming domains can only be resolved by internal DNS
#   (symptom: unreachable while clashctl is on, works after `clashctl off`),
#   send those lookups to the internal resolvers. The #outbound-name suffix
#   makes the query itself egress via that outbound (wired) — essential with
#   Tun, whose default egress would otherwise take the query out via WiFi.
#   Find DNS servers: resolvectl status | nmcli dev show <WIRED_NIC> | grep -i dns
# dns:
#   nameserver-policy:
#     "+.midea.com": ["10.0.0.1#WIRED-DIRECT", "10.0.0.2#WIRED-DIRECT"] # <- internal DNS
#     "+.midea.com.cn": ["10.0.0.1#WIRED-DIRECT", "10.0.0.2#WIRED-DIRECT"]

# tun 配置
tun:
  enable: false
  stack: system
  auto-route: true
  auto-redir: true # clash
  auto-redirect: true # mihomo
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  exclude-src-port: # 排除源端口，避免无法访问容器内服务 https://github.com/nelvko/clash-for-linux-install/issues/100#issuecomment-2995667368
    # - 80
